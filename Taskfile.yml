version: "3"

tasks:
  test:
    desc: Run the library's unit tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  bench:micro:
    desc: Run the library's in-process benchmarks
    cmds:
      - go test -run '^$' -bench . -benchmem {{.CLI_ARGS}} .

  lint:
    desc: Vet both modules
    cmds:
      - go vet ./...
      - cd compliance && go vet ./...
      - cd benchmarks && go vet ./...
      - cd benchmarks/gateway && go vet ./...

  catalog:
    desc: Load and validate the compliance catalog without running any case
    dir: compliance
    cmds:
      - go test ./... -run TestCompliance -ginkgo.focus "has a catalog"

  responders:up:
    desc: Build and start the reference responders
    cmds:
      - docker compose up -d --build --wait

  responders:down:
    desc: Stop the reference responders
    cmds:
      - docker compose down

  compliance:
    desc: Run the compliance suite against the reference responders
    deps: [responders:up]
    dir: compliance
    cmds:
      - go test ./... -timeout 30m {{.CLI_ARGS}}

  bench:
    desc: Compare fcgi-go with nginx in front of php-fpm and update benchmarks/README.md
    dir: benchmarks
    cmds:
      - go run ./cmd/bench -out README.md -rev "$(git rev-parse --short HEAD)" {{.CLI_ARGS}}
