# Response-side CGI (RFC 3875 section 6) and FastCGI 1.0 transport cases.
# Written from the specification text only. respond.php shapes the CGI
# output; php-fpm adds "Content-type: text/html; charset=UTF-8" unless a
# Content-Type is set, and emits no Status line for 200 unless one is set.
cases:
  # ---------------------------------------------------------------- Status
  - id: cgi-resp-status-omitted-defaults-200
    tier: spec
    source: "RFC 3875 section 6.2.1"
    level: MUST
    summary: "A document response without a Status field becomes 200; 6.2.1 defines 200 as the assumed status and the server MUST make the output comply with HTTP."
    request:
      method: GET
      target: "/respond.php?body=hello"
    expect:
      status: 200
      headers: { X-Fixture: respond }
      body: "hello"

  - id: cgi-resp-status-explicit-200
    tier: spec
    source: "RFC 3875 section 6.3.3"
    level: MUST
    summary: "An explicit \"Status: 200 OK\" line yields a 200 response."
    request:
      method: GET
      target: "/respond.php?raw_status=200%20OK&body=ok"
    expect:
      status: 200
      body: "ok"

  - id: cgi-resp-status-field-sets-code
    tier: spec
    source: "RFC 3875 sections 6.2.1 and 6.3.3"
    level: MUST
    summary: "\"Status: 404 Not Found\" from the script sets the HTTP status code to 404."
    request:
      method: GET
      target: "/respond.php?raw_status=404%20Not%20Found&body=missing"
    expect:
      status: 404
      headers: { X-Fixture: respond }

  - id: cgi-resp-status-from-response-code
    tier: spec
    source: "RFC 3875 section 6.3.3"
    level: MUST
    summary: "A Status field produced through http_response_code(201) yields 201."
    request:
      method: GET
      target: "/respond.php?status=201&body=created"
    expect:
      status: 201

  - id: cgi-resp-status-field-name-case-insensitive
    tier: spec
    source: "RFC 3875 section 6.3"
    level: MUST
    summary: "The server recognises the Status CGI field in any letter case (\"status:\"), since CGI field names are not case sensitive."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=status%3A%20409%20Conflict&body=c"
    expect:
      status: 409

  - id: cgi-resp-status-unregistered-code
    tier: spec
    source: "RFC 3875 section 6.3.3"
    level: MAY
    summary: "The script MAY use any valid status code beyond the listed ones; an unregistered 299 reaches the client as 299."
    request:
      method: GET
      target: "/respond.php?raw_status=299%20Custom%20Result&body=x"
    expect:
      status: 299

  - id: cgi-resp-status-without-reason-phrase
    tier: spec
    source: "RFC 3875 section 6.3.3"
    level: OBSERVED
    summary: "The grammar requires a reason-phrase, but the text is silent on a bare \"Status: 404\"; servers uniformly use the code."
    request:
      method: GET
      target: "/respond.php?raw_status=404&body=x"
    expect:
      status: 404

  - id: cgi-resp-status-500-is-script-response
    tier: spec
    source: "RFC 3875 section 6.3.3"
    level: MUST
    summary: "A script-chosen 500 is the script's response, not a gateway error; the script's headers and body reach the client."
    request:
      method: GET
      target: "/respond.php?raw_status=500%20Internal%20Server%20Error&body=script-500"
    expect:
      status: 500
      headers: { X-Fixture: respond }
      body: "script-500"

  - id: cgi-resp-status-503-body-forwarded
    tier: spec
    source: "RFC 3875 section 6.4"
    level: SHOULD
    summary: "The message-body of a non-200 document response is sent unmodified."
    request:
      method: GET
      target: "/respond.php?raw_status=503%20Service%20Unavailable&body=try-later"
    expect:
      status: 503
      body: "try-later"

  - id: cgi-resp-status-field-not-forwarded
    tier: spec
    source: "RFC 3875 section 6.2.1"
    level: MUST
    summary: "Status is a CGI field, not an HTTP header field; the server turns it into the status line and does not send a Status header."
    request:
      method: GET
      target: "/respond.php?raw_status=404%20Not%20Found&body=x"
    expect:
      status: 404
      headers_absent: [Status]

  - id: cgi-resp-status-204-body-dropped
    tier: spec
    source: "RFC 3875 section 6.2.1; RFC 9110 section 15.3.5"
    level: MUST
    summary: "A 204 cannot carry content in HTTP, so the server MUST drop body bytes the script wrote after \"Status: 204\"."
    request:
      method: GET
      target: "/respond.php?raw_status=204%20No%20Content&body=oops"
    expect:
      status: 204
      body: ""

  - id: cgi-resp-status-304-body-dropped
    tier: spec
    source: "RFC 3875 section 6.2.1; RFC 9110 section 15.4.5"
    level: MUST
    summary: "A 304 cannot carry content in HTTP, so the server MUST drop body bytes the script wrote after \"Status: 304\"."
    request:
      method: GET
      target: "/respond.php?raw_status=304%20Not%20Modified&body=oops"
    expect:
      status: 304
      body: ""

  # ---------------------------------------------------------- Content-Type
  - id: cgi-resp-content-type-forwarded-unmodified
    tier: spec
    source: "RFC 3875 section 6.3.1"
    level: SHOULD
    summary: "The Content-Type value SHOULD be sent to the client unmodified."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Content-Type%3A%20application%2Fx-compliance%3B%20charset%3DISO-8859-1&body=x"
    expect:
      status: 200
      headers: { Content-Type: "application/x-compliance; charset=ISO-8859-1" }

  - id: cgi-resp-content-type-parameters-preserved
    tier: spec
    source: "RFC 3875 section 6.3.1"
    level: SHOULD
    summary: "Media-type parameters, including quoted ones, survive unmodified."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Content-Type%3A%20application%2Fvnd.test%2Bjson%3B%20charset%3Dutf-8%3B%20profile%3D%22urn%3Ax%3Ay%22&body=%7B%7D"
    expect:
      headers: { Content-Type: "application/vnd.test+json; charset=utf-8; profile=\"urn:x:y\"" }

  - id: cgi-resp-content-type-not-sniffed
    tier: spec
    source: "RFC 3875 section 6.3.1"
    level: SHOULD
    summary: "The server does not determine the type itself; an HTML-looking body declared text/plain stays text/plain."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Content-Type%3A%20text%2Fplain%3B%20charset%3Dutf-8&body=%3C%21DOCTYPE%20html%3E%3Chtml%3E%3Cbody%3Ex%3C%2Fbody%3E%3C%2Fhtml%3E"
    expect:
      headers: { Content-Type: "text/plain; charset=utf-8" }
      body: "<!DOCTYPE html><html><body>x</body></html>"

  - id: cgi-resp-content-type-field-name-case-insensitive
    tier: spec
    source: "RFC 3875 section 6.3"
    level: MUST
    summary: "A lower-case \"content-type:\" line is the Content-Type CGI field and reaches the client as Content-Type."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=content-type%3A%20text%2Fcsv%3B%20charset%3Dus-ascii&body=a%2Cb"
    expect:
      headers: { Content-Type: "text/csv; charset=us-ascii" }

  # ------------------------------------------------------------- Redirects
  - id: cgi-resp-redirect-302
    tier: spec
    source: "RFC 3875 section 6.2.4"
    level: MUST
    summary: "A client redirect with document (Status 302, absolute Location) becomes an HTTP 302."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2Fdest"
    expect:
      status: 302
      headers: { Location: "https://other.test/dest" }

  - id: cgi-resp-redirect-location-unmodified
    tier: spec
    source: "RFC 3875 sections 6.2.3 and 6.3.2"
    level: MUST
    summary: "The absolute URI in Location reaches the client byte for byte, including query and fragment."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%3A8443%2Fa%2Fb%3Fx%3D1%26y%3D%252F%23frag"
    expect:
      status: 302
      headers: { Location: "https://other.test:8443/a/b?x=1&y=%2F#frag" }

  - id: cgi-resp-redirect-301
    tier: spec
    source: "RFC 3875 section 6.2.4"
    level: MAY
    summary: "The Status of a client redirect with document MAY be another redirect code; 301 reaches the client."
    request:
      method: GET
      target: "/respond.php?raw_status=301%20Moved%20Permanently&header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2F301"
    expect:
      status: 301
      headers: { Location: "https://other.test/301" }

  - id: cgi-resp-redirect-303
    tier: spec
    source: "RFC 3875 section 6.2.4"
    level: MAY
    summary: "A 303 extension-code redirect reaches the client as 303."
    request:
      method: POST
      target: "/respond.php?raw_status=303%20See%20Other&header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2F303"
      headers:
        - [content-type, text/plain]
      body: "form"
    expect:
      status: 303
      headers: { Location: "https://other.test/303" }

  - id: cgi-resp-redirect-307
    tier: spec
    source: "RFC 3875 section 6.2.4"
    level: MAY
    summary: "A 307 extension-code redirect reaches the client as 307."
    request:
      method: GET
      target: "/respond.php?raw_status=307%20Temporary%20Redirect&header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2F307"
    expect:
      status: 307
      headers: { Location: "https://other.test/307" }

  - id: cgi-resp-redirect-308
    tier: spec
    source: "RFC 3875 section 6.2.4"
    level: MAY
    summary: "A 308 extension-code redirect reaches the client as 308."
    request:
      method: GET
      target: "/respond.php?raw_status=308%20Permanent%20Redirect&header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2F308"
    expect:
      status: 308
      headers: { Location: "https://other.test/308" }

  - id: cgi-resp-redirect-document-body-forwarded
    tier: spec
    source: "RFC 3875 sections 6.2.4 and 6.4"
    level: SHOULD
    summary: "The document of a client redirect with document is sent unmodified."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2Fdoc&body=moved-here"
    expect:
      status: 302
      body: "moved-here"

  - id: cgi-resp-redirect-document-content-type
    tier: spec
    source: "RFC 3875 sections 6.2.4 and 6.3.1"
    level: SHOULD
    summary: "The Content-Type of a client redirect with document is sent unmodified."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Location%3A%20https%3A%2F%2Fother.test%2Fdoc&header%5B%5D=Content-Type%3A%20text%2Fplain%3B%20charset%3Dutf-8&body=see"
    expect:
      status: 302
      headers: { Content-Type: "text/plain; charset=utf-8" }

  # --------------------------------------------- Protocol-specific headers
  - id: cgi-resp-extra-header-forwarded
    tier: spec
    source: "RFC 3875 section 6.3.4"
    level: MUST
    summary: "A protocol-specific header field from the script is translated into an HTTP header field."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=X-Compliance%3A%20value-1&body=x"
    expect:
      headers: { X-Compliance: "value-1" }

  - id: cgi-resp-extra-header-name-case-insensitive
    tier: spec
    source: "RFC 3875 sections 6.3 and 6.3.4"
    level: MUST
    summary: "A header field written in lower case by the script reaches the client (compared by canonical name)."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=x-lower-case%3A%20yes&body=x"
    expect:
      headers: { X-Lower-Case: "yes" }

  - id: cgi-resp-cache-control-forwarded
    tier: spec
    source: "RFC 3875 section 6.3.4"
    level: MUST
    summary: "Cache-Control from the script, an HTTP response field, reaches the client unchanged."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Cache-Control%3A%20no-store%2C%20max-age%3D0&body=x"
    expect:
      headers: { Cache-Control: "no-store, max-age=0" }

  - id: cgi-resp-header-value-inner-whitespace-preserved
    tier: spec
    source: "RFC 3875 section 6.3.4"
    level: MUST
    summary: "Inner whitespace and commas in a header value survive translation."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=X-Spaced%3A%20a%20%20b%2C%20%20c&body=x"
    expect:
      headers: { X-Spaced: "a  b,  c" }

  - id: cgi-resp-connection-fields-removed
    tier: spec
    source: "RFC 3875 sections 6.2.1 and 6.3.4; RFC 9113 section 8.2.2"
    level: MUST
    summary: "Connection-specific fields from the script are client-side communication fields; HTTP/2 and HTTP/3 forbid them, so the server MUST remove them."
    transports: [h2, h3]
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Connection%3A%20close&header%5B%5D=Keep-Alive%3A%20timeout%3D5&body=x"
    expect:
      status: 200
      headers_absent: [Connection, Keep-Alive]
      body: "x"

  - id: cgi-resp-transfer-encoding-removed
    tier: spec
    source: "RFC 3875 sections 6.2.1 and 6.3.4; RFC 9113 section 8.2.2"
    level: MUST
    summary: "A Transfer-Encoding field from the script MUST NOT reach an HTTP/2 or HTTP/3 client."
    transports: [h2, h3]
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Transfer-Encoding%3A%20chunked&body=hello"
    expect:
      headers_absent: [Transfer-Encoding]
      body: "hello"

  - id: cgi-resp-transfer-encoding-conflict-resolved
    tier: spec
    source: "RFC 3875 section 6.3.4"
    level: SHOULD
    summary: "The server resolves a script-supplied \"Transfer-Encoding: chunked\" over an unchunked body; the HTTP/1.1 client still reads exactly the body."
    transports: [h1]
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Transfer-Encoding%3A%20chunked&body=hello"
    expect:
      status: 200
      body: "hello"

  # -------------------------------------------------------- Message-body
  - id: cgi-resp-body-bytes-unmodified
    tier: spec
    source: "RFC 3875 section 6.4"
    level: SHOULD
    summary: "CR, LF, tabs and non-ASCII bytes in the body are sent unmodified."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=Content-Type%3A%20application%2Foctet-stream&body=a%0D%0Ab%0Ac%09d%C3%A4%0D%0A"
    expect:
      body: "a\r\nb\nc\td\u00e4\r\n"

  - id: cgi-resp-body-header-lookalike-not-parsed
    tier: spec
    source: "RFC 3875 sections 6.2 and 6.4"
    level: SHOULD
    summary: "Header-shaped lines after the blank line are body, not header fields."
    request:
      method: GET
      target: "/respond.php?body=Status%3A%20500%20X%0D%0AX-Injected%3A%20yes%0D%0A%0D%0Arest"
    expect:
      status: 200
      headers_absent: [X-Injected]
      body: "Status: 500 X\r\nX-Injected: yes\r\n\r\nrest"

  - id: cgi-resp-body-multi-record-reassembled
    tier: spec
    source: "RFC 3875 section 6.4; FastCGI 1.0 section 3.3"
    level: MUST
    summary: "The server reads all script output; a 20,000-byte body that arrives in several FCGI_STDOUT records reaches the client complete and in order."
    request:
      method: GET
      target: "/respond.php?"
    expect:
      status: 200
      body: &z20k 

  - id: cgi-resp-body-after-flush-complete
    tier: spec
    source: "RFC 3875 section 6.4"
    level: MUST
    summary: "The server reads until end of stream, not until the first flush; the whole body arrives."
    request:
      method: GET
      target: "/respond.php?body=flushed-body&flush=1"
    expect:
      body: "flushed-body"

  - id: cgi-resp-head-body-discarded
    tier: spec
    source: "RFC 3875 section 4.3.3"
    level: MUST
    summary: "For HEAD the server MUST discard any message-body the script returns."
    request:
      method: HEAD
      target: "/respond.php?body=should-not-appear"
    expect:
      status: 200
      body: ""

  - id: cgi-resp-head-headers-kept
    tier: spec
    source: "RFC 3875 sections 4.3.3 and 6.3.4"
    level: MUST
    summary: "Discarding the HEAD body keeps the script's header fields."
    request:
      method: HEAD
      target: "/respond.php?header%5B%5D=X-Compliance%3A%20head&body=x"
    expect:
      headers: { X-Fixture: respond, X-Compliance: head }

  - id: cgi-resp-head-error-status-body-discarded
    tier: spec
    source: "RFC 3875 section 4.3.3"
    level: MUST
    summary: "The HEAD body is discarded for a non-200 status too; the status survives."
    request:
      method: HEAD
      target: "/respond.php?raw_status=404%20Not%20Found&body=missing"
    expect:
      status: 404
      body: ""

  - id: cgi-resp-aborted-script-output-forwarded
    tier: spec
    source: "RFC 3875 section 6.4"
    level: MUST
    summary: "Output written before an uncaught error is read and forwarded. The text does not say which status an aborted script gets, so none is asserted."
    waived: "docs/design.md: a responder that ends without FCGI_END_REQUEST answers 502 and never sends partial output."
    request:
      method: GET
      target: "/fatal.php"
    expect:
      body_contains: "before"

  # ----------------------------------------------------------- FCGI_STDERR
  - id: fcgi-stderr-not-in-body
    tier: spec
    source: "FastCGI 1.0 sections 6.1 and 6.2"
    level: MUST
    summary: "FCGI_STDERR carries the script's stderr; its bytes never appear in the response body."
    request:
      method: GET
      target: "/respond.php?stderr=STDERR-MARKER-7f3a&body=ok"
    expect:
      status: 200
      body: "ok"

  - id: fcgi-stderr-only-empty-body
    tier: spec
    source: "FastCGI 1.0 sections 6.1 and 6.2"
    level: MUST
    summary: "A script that writes only to stderr produces an empty body, not the stderr text."
    request:
      method: GET
      target: "/respond.php?stderr=STDERR-ONLY-91c2"
    expect:
      status: 200
      body: ""

  - id: fcgi-stderr-header-lookalike-ignored
    tier: spec
    source: "FastCGI 1.0 sections 6.1 and 6.2"
    level: MUST
    summary: "Header-shaped stderr text does not become a response header field."
    request:
      method: GET
      target: "/respond.php?stderr=X-Injected%3A%20yes%0D%0A%0D%0A&body=ok"
    expect:
      headers_absent: [X-Injected]
      body: "ok"

  - id: fcgi-stderr-status-lookalike-ignored
    tier: spec
    source: "FastCGI 1.0 sections 6.1 and 6.2"
    level: MUST
    summary: "A \"Status:\" line on stderr does not change the response status."
    request:
      method: GET
      target: "/respond.php?stderr=Status%3A%20500%20Oops%0D%0A%0D%0A&body=ok"
    expect:
      status: 200
      body: "ok"

  - id: fcgi-stderr-large-not-in-body
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.1"
    level: MUST
    summary: "20,000 bytes of stderr, spanning several FCGI_STDERR records, stay out of the body."
    request:
      method: GET
      target: "/respond.php?&body=ok"
    expect:
      status: 200
      body: "ok"

  - id: fcgi-stderr-interleaved-with-large-stdout
    tier: spec
    source: "FastCGI 1.0 sections 6.1 and 6.2"
    level: MUST
    summary: "Stdout and stderr records arrive concurrently; the body contains exactly the stdout bytes."
    request:
      method: GET
      target: "/respond.php?stderr=interleaved-stderr&"
    expect:
      body: *z20k

  # ------------------------------------------------------------ FCGI_PARAMS
  - id: fcgi-params-value-127-bytes
    tier: spec
    source: "FastCGI 1.0 section 3.4"
    level: MUST
    summary: "A 127-byte value, the largest with a one-byte length, arrives intact."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-len, vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv]
    expect:
      env: { HTTP_X_LEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv }

  - id: fcgi-params-value-128-bytes
    tier: spec
    source: "FastCGI 1.0 section 3.4"
    level: MUST
    summary: "A 128-byte value needs the four-byte length encoding and arrives intact."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-len, vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv]
    expect:
      env: { HTTP_X_LEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv }

  - id: fcgi-params-name-127-bytes
    tier: spec
    source: "FastCGI 1.0 section 3.4"
    level: MUST
    summary: "A 127-byte parameter name, the largest with a one-byte length, arrives intact."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn, name-127]
    expect:
      env: { HTTP_X_NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN: name-127 }

  - id: fcgi-params-name-128-bytes
    tier: spec
    source: "FastCGI 1.0 section 3.4"
    level: MUST
    summary: "A 128-byte parameter name needs the four-byte length encoding and arrives intact."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn, name-128]
    expect:
      env: { HTTP_X_NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN: name-128 }

  - id: fcgi-params-value-60000-bytes
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 3.4"
    level: MUST
    summary: "A 60,000-byte header value arrives intact as HTTP_X_BIG."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-big, &w60k ]
    expect:
      env: { HTTP_X_BIG: *w60k }

  - id: fcgi-params-caller-param-60000-bytes
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 3.4"
    level: MUST
    summary: "A 60,000-byte parameter set by the caller arrives intact."
    request:
      method: GET
      target: "/dump.php"
    route:
      params: { APP_BLOB: *w60k }
    expect:
      env: { APP_BLOB: *w60k }

  - id: fcgi-params-set-larger-than-one-record
    tier: spec
    source: "FastCGI 1.0 section 3.3"
    level: MUST
    summary: "Four 20,000-byte headers exceed one 65,535-byte record; the params stream is split across records and every pair arrives intact."
    request:
      method: GET
      target: "/dump.php"
      headers:
        - [x-part-a, &b20k ]
        - [x-part-b, *b20k]
        - [x-part-c, *b20k]
        - [x-part-d, *b20k]
    expect:
      env:
        HTTP_X_PART_A: *b20k
        HTTP_X_PART_B: *b20k
        HTTP_X_PART_C: *b20k
        HTTP_X_PART_D: *b20k

  - id: fcgi-params-split-set-keeps-cgi-variables
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "When the params stream spans several records, the CGI meta-variables still arrive with their values."
    request:
      method: GET
      target: "/dump.php?q=1"
      headers:
        - [x-part-a, *b20k]
        - [x-part-b, *b20k]
        - [x-part-c, *b20k]
        - [x-part-d, *b20k]
    expect:
      env: { REQUEST_METHOD: GET, QUERY_STRING: "q=1", GATEWAY_INTERFACE: CGI/1.1 }

  # ------------------------------------------------------------- FCGI_STDIN
  - id: fcgi-stdin-empty-get-terminated
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "Without a body the stdin stream is terminated by an empty record at once; the responder reads 0 bytes and does not hang."
    request:
      method: GET
      target: "/dump.php"
    route:
      timeout_ms: 3000
    expect:
      status: 200
      stdin_length: 0

  - id: fcgi-stdin-empty-post-terminated
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A POST with Content-Length 0 yields a terminated, empty stdin stream."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
        - [content-length, "0"]
      framing: none
    route:
      timeout_ms: 3000
    expect:
      status: 200
      stdin_length: 0

  - id: fcgi-stdin-small-body
    tier: spec
    source: "FastCGI 1.0 section 6.2"
    level: MUST
    summary: "A short body reaches the responder on FCGI_STDIN byte for byte."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, text/plain]
      body: "hello"
    expect:
      stdin_length: 5
      stdin_sha256: "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824"

  - id: fcgi-stdin-65535-bytes
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A body of exactly one full record (65,535 bytes) arrives intact."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 65535
    expect:
      stdin_length: 65535
      stdin_sha256: "5f1bf999bcba5e05d4c34a13710d2e4bff005877874dcce49ac87af61076231e"

  - id: fcgi-stdin-65536-bytes
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A body one byte larger than a record (65,536 bytes) is split and arrives intact."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 65536
    expect:
      stdin_length: 65536
      stdin_sha256: "7daca2095d0438260fa849183dfc67faa459fdf4936e1bc91eec6b281b27e4c2"

  - id: fcgi-stdin-200000-bytes
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A 200,000-byte body spanning several records arrives intact and in order."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 200000
    expect:
      stdin_length: 200000
      stdin_sha256: "c7a7d73b68d21102bf7d6d9be27b4106497efc8119224bebfbd26b375541bde7"

  - id: fcgi-stdin-200000-bytes-chunked
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A 200,000-byte body sent without a length (chunked on h1, several DATA frames on h2/h3) arrives intact."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 200000
      framing: chunked
    expect:
      stdin_length: 200000
      stdin_sha256: "c7a7d73b68d21102bf7d6d9be27b4106497efc8119224bebfbd26b375541bde7"

  - id: fcgi-stdin-length-matches-content-length
    tier: spec
    source: "FastCGI 1.0 section 6.2"
    level: MUST
    summary: "The responder receives at most CONTENT_LENGTH bytes; for a chunked body CONTENT_LENGTH and the stdin length agree."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 65536
      framing: chunked
    expect:
      env: { CONTENT_LENGTH: "65536" }
      stdin_length: 65536

  - id: fcgi-stdin-2mib
    tier: spec
    source: "FastCGI 1.0 sections 3.3 and 6.2"
    level: MUST
    summary: "A 2 MiB body, far beyond one record, arrives intact."
    request:
      method: POST
      target: "/dump.php"
      headers:
        - [content-type, application/octet-stream]
      body_size: 2097152
    expect:
      stdin_length: 2097152
      stdin_sha256: "91d3beb88a9b2f778a6c44a1c53b63d3c79931845a9aef84b3fb414610bd1938"

  # ------------------------------------------------------ Responder, END_REQUEST
  - id: fcgi-responder-receives-cgi-environment
    tier: spec
    source: "FastCGI 1.0 section 6.2"
    level: MUST
    summary: "The Responder receives CGI/1.1 environment variables over FCGI_PARAMS."
    request:
      method: GET
      target: "/dump.php"
    expect:
      env: { GATEWAY_INTERFACE: CGI/1.1, REQUEST_METHOD: GET }

  - id: fcgi-responder-stdout-is-response
    tier: spec
    source: "FastCGI 1.0 section 6.2"
    level: MUST
    summary: "The Responder's FCGI_STDOUT carries CGI/1.1 output; its header fields and body form the HTTP response."
    request:
      method: GET
      target: "/respond.php?header%5B%5D=X-Compliance%3A%20stdout&body=from-stdout"
    expect:
      headers: { X-Fixture: respond, X-Compliance: stdout }
      body: "from-stdout"

  - id: fcgi-end-request-completes-response
    tier: spec
    source: "FastCGI 1.0 sections 5.5 and 6.2"
    level: MUST
    summary: "FCGI_END_REQUEST ends the request; the response completes promptly even if the connection to the application stays open."
    request:
      method: GET
      target: "/respond.php?body=done"
    route:
      timeout_ms: 3000
    expect:
      status: 200
      body: "done"

  - id: fcgi-end-request-after-delayed-output
    tier: spec
    source: "FastCGI 1.0 sections 5.5 and 6.2"
    level: MUST
    summary: "The server waits for FCGI_END_REQUEST, not for the first stdout record; output after a 300 ms delay is complete."
    request:
      method: GET
      target: "/respond.php?sleep_ms=300&body=late"
    route:
      timeout_ms: 3000
    expect:
      status: 200
      body: "late"
