  - id: php-out-binary-nul
    tier: app
    source: "php.net echo"
    level: OBSERVED
    summary: A body of three NUL bytes arrives unchanged.
    request: { method: GET, target: "/app/session/bin.php?case=nul" }
    expect:
      status: 200
      body: "\0\0\0"

  - id: php-out-binary-header-like
    tier: app
    source: "php.net echo; RFC 3875 section 6.2 (the response body follows the header block)"
    level: OBSERVED
    summary: A body that looks like a header block stays body and sets no status or header.
    request: { method: GET, target: "/app/session/bin.php?case=header_like" }
    expect:
      status: 200
      headers_absent: [X-Injected]
