  - id: php-out-readfile-2mib
    tier: app
    source: "php.net readfile()"
    level: OBSERVED
    summary: readfile() of a 2 MiB file arrives complete with its Content-Length.
    request: { method: GET, target: "/app/session/readfile.php?size=2097152&kind=big" }
    expect:
      status: 200
      headers: { Content-Length: "2097152" }
      body_contains: "rrrrEND"

  - id: php-out-binary-ascii-range
    tier: app
    source: "php.net echo; php.net chr()"
    level: OBSERVED
    summary: Bytes 0x00 to 0x7f, control characters included, arrive unchanged.
    request: { method: GET, target: "/app/session/bin.php?case=ascii" }
