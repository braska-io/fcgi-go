scenarios:
  - id: php-sess-values-persist
    tier: app
    source: "php.net session_start() (creates a session or resumes the current one based on a session identifier passed via a cookie)"
    level: OBSERVED
    summary: With the session cookie sent back, the counter grows across three requests.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=1" }
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=2" }
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=3" }

  - id: php-sess-cookie-not-resent
    tier: app
    source: "php.net session_start(); php.net session.configuration (session.use_cookies)"
    level: OBSERVED
    summary: A resumed session sends no new session cookie.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=1" }
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=2", headers_absent: [Set-Cookie] }

  - id: php-sess-strict-adopts-issued-id
    tier: app
    source: "php.net session.configuration (session.use_strict_mode: the module does not accept uninitialized session IDs)"
    level: MUST
    summary: Strict mode adopts an id that the module itself issued.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/strict.php" }
        expect: { status: 200, body: "no-id-sent" }
      - request: { method: GET, target: "/app/session/strict.php" }
        expect: { status: 200, body: "adopted" }

  - id: php-sess-typed-values-roundtrip
    tier: app
    source: "php.net session_start(); php.net session.configuration (session.serialize_handler)"
    level: OBSERVED
    summary: Integers, floats, booleans, null, lists and escaped strings survive the session round trip.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/data.php?op=set_typed" }
        expect: { status: 200, body: "ok" }
      - request: { method: GET, target: "/app/session/data.php?op=dump" }
        expect:
          status: 200
          body: '{"typed":{"int":42,"float":1.5,"bool":true,"null":null,"list":[1,2,3],"str":"a\"b\\c\nd"}}'

  - id: php-sess-regenerate-keeps-data
    tier: app
    source: "php.net session_regenerate_id() (replaces the current session id and keeps the current session information)"
    level: OBSERVED
    summary: session_regenerate_id() issues a new id, keeps the old session file and the data, and the new cookie resumes it.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/data.php?op=set&k=user&v=alice" }
        expect: { status: 200, body: "ok" }
      - request: { method: GET, target: "/app/session/regen.php?delete=0" }
        expect: { status: 200, body: "ok=1 changed=1 old_file=1 user=alice" }
      - request: { method: GET, target: "/app/session/data.php?op=get&k=user" }
        expect: { status: 200, body: "alice", headers_absent: [Set-Cookie] }

  - id: php-sess-regenerate-deletes-old
    tier: app
    source: "php.net session_regenerate_id() (delete_old_session: whether to delete the old associated session file)"
    level: OBSERVED
    summary: session_regenerate_id(true) deletes the old session file and the data moves to the new id.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/data.php?op=set&k=user&v=bob" }
        expect: { status: 200, body: "ok" }
      - request: { method: GET, target: "/app/session/regen.php?delete=1" }
        expect: { status: 200, body: "ok=1 changed=1 old_file=0 user=bob" }
      - request: { method: GET, target: "/app/session/data.php?op=get&k=user" }
        expect: { status: 200, body: "bob" }

  - id: php-sess-destroy-and-delete-cookie
    tier: app
    source: "php.net session_destroy() (example #1: delete the session cookie with setcookie(), then destroy)"
    level: OBSERVED
    summary: Destroying the session the documented way deletes the cookie, and the next request starts a fresh session.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=1" }
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=2" }
      - request: { method: GET, target: "/app/session/destroy.php" }
        expect:
          status: 200
          headers_all:
            Set-Cookie: ["FCGISESSID=deleted; expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; path=/; HttpOnly"]
          body: "destroyed=true status=none"
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=1" }

  - id: php-sess-lock-serializes
    tier: app
    source: "php.net session_write_close() (session data is locked to prevent concurrent writes; only one script may operate on a session at any time)"
    level: OBSERVED
    summary: Two parallel requests on one session serialize; the second waits for the first's 1500 ms hold and sees its write.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/lock.php?tag=init" }
        expect: { status: 200, body: "init seen=init" }
      - parallel:
          - request: { method: GET, target: "/app/session/lock.php?tag=a&hold_ms=1500" }
            expect: { status: 200, body: "a seen=init,a", duration_min_ms: 1500 }
          - request: { method: GET, target: "/app/session/lock.php?tag=b&delay_ms=200" }
            expect: { status: 200, body: "b seen=init,a,b", duration_min_ms: 1300 }

  - id: php-sess-write-close-releases-lock
    tier: app
    source: "php.net session_write_close() (end the session as soon as all changes to session variables are done)"
    level: OBSERVED
    summary: session_write_close() releases the lock early, so a parallel request on the same session does not wait for the hold.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/lock.php?tag=init" }
        expect: { status: 200, body: "init seen=init" }
      - parallel:
          - request: { method: GET, target: "/app/session/lock.php?tag=a&hold_ms=1500&close=1" }
            expect: { status: 200, body: "a seen=init,a", duration_min_ms: 1500 }
          - request: { method: GET, target: "/app/session/lock.php?tag=b&delay_ms=200" }
            expect: { status: 200, body: "b seen=init,a,b", duration_max_ms: 1000 }

  - id: php-sess-read-and-close-no-lock
    tier: app
    source: "php.net session_start() (read_and_close: the session is closed immediately after being read, avoiding unnecessary locking)"
    level: MUST
    summary: A read_and_close request holds no lock and writes nothing back; a parallel writer proceeds at once.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/lock.php?tag=init" }
        expect: { status: 200, body: "init seen=init" }
      - parallel:
          - request: { method: GET, target: "/app/session/lock.php?tag=a&hold_ms=1500&ro=1" }
            expect: { status: 200, body: "a seen=init,a", duration_min_ms: 1500 }
          - request: { method: GET, target: "/app/session/lock.php?tag=b&delay_ms=200" }
            expect: { status: 200, body: "b seen=init,b", duration_max_ms: 1000 }
      - request: { method: GET, target: "/app/session/lock.php?tag=z" }
        expect: { status: 200, body: "z seen=init,b,z" }

  - id: php-out-cookie-roundtrip
    tier: app
    source: "php.net setcookie() (multiple calls in order; deleting a cookie)"
    level: OBSERVED
    summary: Cookies set by setcookie() come back in $_COOKIE, and a deleted one is gone on the next request.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/cookies.php?case=multi" }
        expect: { status: 200, headers_all: { Set-Cookie: ["a=1", "b=2", "c=3"] } }
      - request: { method: GET, target: "/app/session/cookies.php?case=read" }
        expect: { status: 200, body: '{"a":"1","b":"2","c":"3"}' }
      - request: { method: GET, target: "/app/session/cookies.php?case=delete_a" }
        expect:
          status: 200
          headers_all: { Set-Cookie: ["a=deleted; expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0"] }
      - request: { method: GET, target: "/app/session/cookies.php?case=read" }
        expect: { status: 200, body: '{"b":"2","c":"3"}' }

  - id: php-out-cookie-encoded-roundtrip
    tier: app
    source: "php.net setcookie() (the value portion of the cookie will automatically be urlencoded and decoded by PHP)"
    level: OBSERVED
    summary: A value urlencoded by setcookie() decodes back to the original in $_COOKIE.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/cookies.php?case=encode" }
        expect: { status: 200 }
      - request: { method: GET, target: "/app/session/cookies.php?case=read" }
        expect: { status: 200, body: '{"enc":"a;b\/c"}' }

  - id: php-sess-with-app-cookies
    tier: app
    source: "php.net session_start(); php.net setcookie()"
    level: OBSERVED
    summary: The session survives when the Cookie field also carries several application cookies.
    cookie_jar: true
    steps:
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=1" }
      - request: { method: GET, target: "/app/session/cookies.php?case=multi" }
        expect: { status: 200 }
      - request: { method: GET, target: "/app/session/counter.php" }
        expect: { status: 200, body: "n=2" }
