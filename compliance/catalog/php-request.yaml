  - id: php-req-query-nesting-at-limit
    tier: app
    source: "php.net, info.configuration, max_input_nesting_level"
    level: MUST
    summary: "A name nested 64 levels deep, the max_input_nesting_level, is kept."
    request:
      method: GET
      target: "/app/request/limits.php?a[x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x]=1&b=2"
    expect:
      status: 200
      body: "{\"get\":2,\"post\":0,\"cookie\":0,\"warning\":null}"

  - id: php-req-query-nesting-over-limit
    tier: app
    source: "php.net, info.configuration, max_input_nesting_level"
    level: OBSERVED
    summary: "A name nested 65 levels deep exceeds max_input_nesting_level and is dropped; other variables stay."
    request:
      method: GET
      target: "/app/request/limits.php?a[x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x][x]=1&b=2"
    expect:
      status: 200
      body_contains: "{\"get\":1,"

  - id: php-req-form-simple
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "An application/x-www-form-urlencoded body fills $_POST."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=1&b=x+y"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\",\"b\":\"x y\"},\"warning\":null}"

  - id: php-req-form-arrays-and-dots
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Form bodies follow the same name rules as the query: arrays nest, dots become underscores."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "l[]=1&l[]=2&m[k]=v&a.b=c"
    expect:
      status: 200
      body: "{\"post\":{\"l\":[\"1\",\"2\"],\"m\":{\"k\":\"v\"},\"a_b\":\"c\"},\"warning\":null}"

  - id: php-req-form-charset-param
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A charset parameter on the form content type does not stop parsing."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded; charset=UTF-8"]
      body: "a=%C3%A4"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"ä\"},\"warning\":null}"

  - id: php-req-form-content-type-case
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: OBSERVED
    summary: "The form media type matches case-insensitively, as RFC 9110 section 8.3.1 defines it."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "Application/X-WWW-Form-Urlencoded"]
      body: "a=1"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\"},\"warning\":null}"

  - id: php-req-form-empty-body
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "An empty form body leaves $_POST empty."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: ""
      framing: length
    expect:
      status: 200
      body: "{\"post\":{},\"warning\":null}"

  - id: php-req-form-input-readable
    tier: app
    source: "php.net, php:// wrappers, php://input (wrappers.php)"
    level: MUST
    summary: "php://input returns the raw form body next to the parsed $_POST."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=1&b=%20"
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"application/x-www-form-urlencoded\",\"content_length\":\"9\",\"post\":{\"a\":\"1\",\"b\":\" \"},\"files\":0,\"input_length\":9,\"input_sha256\":\"b1bbe8d97b670bffb6ff7bca9d3b7c681fec15114d1ac03c86079d45a8e001c9\",\"input\":\"a=1&b=%20\",\"warning\":null}"

  - id: php-req-form-chunked
    tier: app
    source: "php.net, $_POST (reserved.variables.post); docs/design.md, CONTENT_LENGTH is always exact"
    level: MUST
    summary: "A chunked form body reaches PHP with CONTENT_LENGTH and fills $_POST."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=1&b=2&c=3"
      framing: chunked
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"application/x-www-form-urlencoded\",\"content_length\":\"11\",\"post\":{\"a\":\"1\",\"b\":\"2\",\"c\":\"3\"},\"files\":0,\"input_length\":11,\"input_sha256\":\"140533f5d7e20d4b831cf75c613efc8c59d4638c8c5b47aeb9b976588acb8561\",\"input\":\"a=1&b=2&c=3\",\"warning\":null}"

  - id: php-req-form-put-not-parsed
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "$_POST is filled only for POST; a PUT form body stays in php://input."
    request:
      method: PUT
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=1"
    expect:
      status: 200
      body: "{\"method\":\"PUT\",\"content_type\":\"application/x-www-form-urlencoded\",\"content_length\":\"3\",\"post\":{},\"files\":0,\"input_length\":3,\"input_sha256\":\"c22fea5d7428e5cf47ef6354c97c9223c95d6dcdc3e0d2300ff79056b1ff3d85\",\"input\":\"a=1\",\"warning\":null}"

  - id: php-req-form-max-input-vars-truncated
    tier: app
    source: "php.net, info.configuration, max_input_vars"
    level: MUST
    summary: "A form body with 1001 variables keeps max_input_vars (1000) in $_POST."
    waived: "PHP 8.3 registers a urlencoded POST variable before it counts it (main/php_variables.c), so it keeps 1001 of 1001; the case tests PHP, not the gateway."
    request:
      method: POST
      target: "/app/request/limits.php"
