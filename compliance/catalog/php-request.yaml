# PHP's own parsing of requests that crossed the gateway: query, form,
# multipart, uploads, cookies, headers and credentials, as php.net and
# RFC 7578 describe them. Fixtures: fixtures/php/app/request/*.php.
# Generated with exact multipart bodies; framing length computes Content-Length.
cases:
  - id: php-req-query-simple
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: MUST
    summary: "$_GET holds every name=value pair of QUERY_STRING."
    request:
      method: GET
      target: "/app/request/get.php?a=1&b=2"
    expect:
      status: 200
      body: "{\"a\":\"1\",\"b\":\"2\"}"

  - id: php-req-query-list-array
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Names ending in [] build a list in $_GET."
    request:
      method: GET
      target: "/app/request/get.php?a[]=1&a[]=2"
    expect:
      status: 200
      body: "{\"a\":[\"1\",\"2\"]}"

  - id: php-req-query-nested-array
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Nested bracket names build nested arrays in $_GET."
    request:
      method: GET
      target: "/app/request/get.php?a[b][c]=1&a[b][d]=2"
    expect:
      status: 200
      body: "{\"a\":{\"b\":{\"c\":\"1\",\"d\":\"2\"}}}"

  - id: php-req-query-dot-to-underscore
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "A dot in a variable name becomes an underscore."
    request:
      method: GET
      target: "/app/request/get.php?a.b=1"
    expect:
      status: 200
      body: "{\"a_b\":\"1\"}"

  - id: php-req-query-space-to-underscore
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "A space in a variable name, sent as %20, becomes an underscore."
    request:
      method: GET
      target: "/app/request/get.php?a%20b=1"
    expect:
      status: 200
      body: "{\"a_b\":\"1\"}"

  - id: php-req-query-dot-inside-brackets-kept
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: OBSERVED
    summary: "A dot inside an array key is not converted; only the base name is."
    request:
      method: GET
      target: "/app/request/get.php?x.y[a.b]=1"
    expect:
      status: 200
      body: "{\"x_y\":{\"a.b\":\"1\"}}"

  - id: php-req-query-trailing-chars-ignored
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Characters after a valid array suffix are silently ignored: foo[bar]baz becomes foo[bar]."
    request:
      method: GET
      target: "/app/request/get.php?foo[bar]baz=1"
    expect:
      status: 200
      body: "{\"foo\":{\"bar\":\"1\"}}"

  - id: php-req-query-unclosed-bracket
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: OBSERVED
    summary: "An unclosed '[' in a name is converted to an underscore."
    request:
      method: GET
      target: "/app/request/get.php?a[b=1"
    expect:
      status: 200
      body: "{\"a_b\":\"1\"}"

  - id: php-req-query-duplicate-last-wins
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: OBSERVED
    summary: "A repeated scalar name keeps the last value."
    request:
      method: GET
      target: "/app/request/get.php?a=1&a=2"
    expect:
      status: 200
      body: "{\"a\":\"2\"}"

  - id: php-req-query-percent-decoded
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: MUST
    summary: "Values in $_GET pass through urldecode(): %41%C3%A4 becomes the UTF-8 text."
    request:
      method: GET
      target: "/app/request/get.php?v=%41%C3%A4%2F%26"
    expect:
      status: 200
      body: "{\"v\":\"Aä/&\"}"

  - id: php-req-query-plus-is-space
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: MUST
    summary: "urldecode() turns '+' into a space."
    request:
      method: GET
      target: "/app/request/get.php?v=a+b"
    expect:
      status: 200
      body: "{\"v\":\"a b\"}"

  - id: php-req-query-encoded-plus
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: MUST
    summary: "%2B decodes to a literal '+'."
    request:
      method: GET
      target: "/app/request/get.php?v=a%2Bb"
    expect:
      status: 200
      body: "{\"v\":\"a+b\"}"

  - id: php-req-query-empty-value
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: OBSERVED
    summary: "A name with '=' and no value is an empty string."
    request:
      method: GET
      target: "/app/request/get.php?a=&b=2"
    expect:
      status: 200
      body: "{\"a\":\"\",\"b\":\"2\"}"

  - id: php-req-query-values-stay-strings
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Values stay strings: null and 123 are not converted."
    request:
      method: GET
      target: "/app/request/get.php?var1=null&var2=123"
    expect:
      status: 200
      body: "{\"var1\":\"null\",\"var2\":\"123\"}"

  - id: php-req-query-semicolon-not-separator
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: OBSERVED
    summary: "With the default arg_separator.input '&', a semicolon stays part of the value."
    request:
      method: GET
      target: "/app/request/get.php?a=1;b=2"
    expect:
      status: 200
      body: "{\"a\":\"1;b=2\"}"

  - id: php-req-query-nul-byte-in-value
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: OBSERVED
    summary: "%00 in a value decodes to a NUL byte that survives in $_GET."
    request:
      method: GET
      target: "/app/request/get.php?v=a%00b"
    expect:
      status: 200
      body: "{\"v\":\"a\\u0000b\"}"

  - id: php-req-query-on-post
    tier: app
    source: "php.net, $_GET (reserved.variables.get)"
    level: MUST
    summary: "$_GET is populated whenever a query string is present, regardless of the request method."
    request:
      method: POST
      target: "/app/request/get.php?a=get&b=1"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=post"
    expect:
      status: 200
      body: "{\"a\":\"get\",\"b\":\"1\"}"

  - id: php-req-query-max-input-vars-truncated
    tier: app
    source: "php.net, info.configuration, max_input_vars"
    level: MUST
    summary: "With 1001 query variables, $_GET keeps max_input_vars (1000) and truncates the rest."
