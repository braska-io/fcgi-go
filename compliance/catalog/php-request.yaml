      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"l[]\"\r\n\r\n1\r\n--XyZ\r\nContent-Disposition: form-data; name=\"l[]\"\r\n\r\n2\r\n--XyZ\r\nContent-Disposition: form-data; name=\"m[k]\"\r\n\r\nv\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"l\":[\"1\",\"2\"],\"m\":{\"k\":\"v\"}},\"count\":0,\"files\":{},\"warning\":null}"

