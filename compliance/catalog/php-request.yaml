      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\nhello\r\n--XyZ--\r\n"
    expect:
      status: 200
