  - id: php-req-upload-boundary-lookalike
    tier: app
    source: "RFC 7578 section 4.1"
    level: MUST
    summary: "The boundary string without a preceding CRLF is content; only CRLF followed by --boundary delimits a part."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"f\"; filename=\"l.txt\"\r\nContent-Type: text/plain\r\n\r\na--XyZ b --XyZ-- c--XyZ--\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"post\":{},\"count\":1,\"files\":{\"f\":{\"name\":\"l.txt\",\"full_path\":\"l.txt\",\"type\":\"text/plain\",\"size\":25,\"error\":0,\"uploaded\":true,\"sha256\":\"3c5ca340084742893a7e5bcbc8203cb9d17b5f37d25ba05b7e0dfaba2ecec363\"}},\"warning\":null}"

  - id: php-req-upload-max-file-size-field
    tier: app
    source: "php.net, POST method uploads (features.file-upload.post-method); php.net, Error Messages Explained (features.file-upload.errors)"
    level: MUST
    summary: "A MAX_FILE_SIZE field before the file rejects a larger file with UPLOAD_ERR_FORM_SIZE (2)."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"MAX_FILE_SIZE\"\r\n\r\n4\r\n--XyZ\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\n0123456789\r\n--XyZ--\r\n"
    expect:
      status: 200
      body_contains: "\"size\":0,\"error\":2,\"uploaded\":false"

  - id: php-req-upload-max-file-size-after
    tier: app
    source: "php.net, POST method uploads (features.file-upload.post-method)"
    level: OBSERVED
    summary: "MAX_FILE_SIZE must precede the file input; placed after it, it does not apply."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\n0123456789\r\n--XyZ\r\nContent-Disposition: form-data; name=\"MAX_FILE_SIZE\"\r\n\r\n4\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"MAX_FILE_SIZE\":\"4\"},\"count\":1,\"files\":{\"f\":{\"name\":\"a.txt\",\"full_path\":\"a.txt\",\"type\":\"text/plain\",\"size\":10,\"error\":0,\"uploaded\":true,\"sha256\":\"84d89877f0d4041efb6bf91a16f0248f2fd573e6af05c19f96bedb9f882f7882\"}},\"warning\":null}"

  - id: php-req-upload-max-file-uploads
    tier: app
    source: "php.net, ini.core, max_file_uploads"
