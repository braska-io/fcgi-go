  - id: php-req-upload-is-uploaded-file
    tier: app
    source: "php.net, is_uploaded_file and move_uploaded_file"
    level: MUST
    summary: "is_uploaded_file is true for tmp_name and false for /etc/passwd; move_uploaded_file moves the upload and refuses the foreign file."
    request:
      method: POST
      target: "/app/request/move.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a.txt\"\r\nContent-Type: text/plain\r\n\r\nhello\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"is_uploaded_file\":true,\"foreign_is_uploaded_file\":false,\"foreign_moved\":false,\"moved\":true,\"tmp_left\":false,\"sha256\":\"2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824\"}"

  - id: php-req-request-order
    tier: app
    source: "php.net, $_REQUEST (reserved.variables.request); ini.core, request_order and variables_order"
    level: MUST
    summary: "With request_order unset, variables_order EGPCS fills $_REQUEST from GET, then POST, then COOKIE; later values override earlier ones."
    request:
      method: POST
      target: "/app/request/request.php?a=get&g=1"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
        - ["Cookie", "a=cookie; c=1"]
      body: "a=post&p=1"
    expect:
      status: 200
      body: "{\"request_order\":\"\",\"variables_order\":\"EGPCS\",\"request\":{\"a\":\"cookie\",\"g\":\"1\",\"p\":\"1\",\"c\":\"1\"}}"

  - id: php-req-request-post-over-get
    tier: app
    source: "php.net, $_REQUEST (reserved.variables.request); ini.core, request_order and variables_order"
    level: MUST
    summary: "Without a cookie, the POST value overrides the GET value in $_REQUEST."
    request:
      method: POST
      target: "/app/request/request.php?a=get"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body: "a=post"
    expect:
      status: 200
      body_contains: "\"request\":{\"a\":\"post\"}"

  - id: php-req-cookie-multiple
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external)"
    level: MUST
    summary: "Every pair in the Cookie header appears in $_COOKIE."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "a=1; b=2"]
    expect:
      status: 200
      body: "{\"a\":\"1\",\"b\":\"2\"}"

  - id: php-req-cookie-equals-in-value
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external)"
    level: OBSERVED
    summary: "Only the first '=' separates name and value."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "t=a=b=c"]
    expect:
      status: 200
      body: "{\"t\":\"a=b=c\"}"

  - id: php-req-cookie-value-urldecoded
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external)"
    level: OBSERVED
    summary: "Percent-encoded cookie values are decoded."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "v=hello%20w%C3%B6rld"]
    expect:
      status: 200
      body: "{\"v\":\"hello wörld\"}"

  - id: php-req-cookie-name-not-urldecoded
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Cookie names are no longer url-decoded (PHP 7.4.11+)."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "a%5Fb=1"]
    expect:
      status: 200
      body: "{\"a%5Fb\":\"1\"}"

  - id: php-req-cookie-dot-name
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "A dot in a cookie name becomes an underscore."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "a.b=1"]
    expect:
      status: 200
      body: "{\"a_b\":\"1\"}"

  - id: php-req-cookie-array
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external)"
    level: MUST
    summary: "Cookies named c[x] and c[y] form one array $_COOKIE['c']."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "c[x]=1; c[y]=2"]
    expect:
      status: 200
      body: "{\"c\":{\"x\":\"1\",\"y\":\"2\"}}"

  - id: php-req-cookie-duplicate-first-wins
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external)"
    level: OBSERVED
    summary: "Of two cookies with one name, the first is kept, matching RFC 6265 section 5.4 ordering by path specificity."
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["Cookie", "a=1; a=2"]
    expect:
      status: 200
      body: "{\"a\":\"1\"}"

  - id: php-req-cookie-split-h2-fields
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external); RFC 9113 section 8.2.3"
    level: MUST
    summary: "Cookie pairs sent in two HTTP/2 cookie fields both reach $_COOKIE."
    transports: [h2, h3]
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["cookie", "a=1"]
        - ["cookie", "b=2"]
    expect:
      status: 200
      body: "{\"a\":\"1\",\"b\":\"2\"}"

  - id: php-req-cookie-split-h2-three-fields
    tier: app
    source: "php.net, Variables From External Sources, HTTP Cookies (language.variables.external); RFC 9113 section 8.2.3"
    level: MUST
    summary: "Three split cookie fields, one with two pairs, all reach $_COOKIE in order."
    transports: [h2, h3]
    request:
      method: GET
      target: "/app/request/cookie.php"
      headers:
        - ["cookie", "a=1"]
        - ["cookie", "b=2; c=3"]
        - ["cookie", "d=4"]
    expect:
      status: 200
      body: "{\"a\":\"1\",\"b\":\"2\",\"c\":\"3\",\"d\":\"4\"}"

  - id: php-req-headers-custom
    tier: app
    source: "php.net, getallheaders (function.getallheaders)"
    level: MUST
    summary: "getallheaders() returns a request header with its value."
    request:
      method: GET
      target: "/app/request/headers.php"
      headers:
        - ["X-Custom", "v1"]
    expect:
      status: 200
      body_contains: "\"X-Custom\":\"v1\""

  - id: php-req-headers-name-normalised
    tier: app
    source: "php.net, getallheaders (function.getallheaders)"
    level: OBSERVED
    summary: "php-fpm rebuilds names from HTTP_* parameters, so a lowercase name reads as X-Lower-Case."
    request:
      method: GET
      target: "/app/request/headers.php"
      headers:
        - ["x-lower-case", "v"]
    expect:
      status: 200
      body_contains: "\"X-Lower-Case\":\"v\""

  - id: php-req-headers-duplicate-joined
    tier: app
    source: "php.net, getallheaders (function.getallheaders); RFC 9110 section 5.3"
    level: MUST
    summary: "Two fields with one name read as one comma-joined value."
    request:
      method: GET
      target: "/app/request/headers.php"
      headers:
        - ["X-Dup", "a"]
        - ["X-Dup", "b"]
    expect:
      status: 200
      body_contains: "\"X-Dup\":\"a, b\""

  - id: php-req-headers-content-length-chunked
    tier: app
    source: "php.net, getallheaders (function.getallheaders); docs/design.md, CONTENT_LENGTH is always exact"
    level: OBSERVED
    summary: "For a chunked body getallheaders() shows the exact Content-Length the gateway computed."
    request:
      method: POST
      target: "/app/request/headers.php"
      headers:
        - ["Content-Type", "text/plain"]
      body: "hello"
      framing: chunked
    expect:
      status: 200
      body_contains: "\"Content-Length\":\"5\""

  - id: php-req-headers-value-spaces
    tier: app
    source: "php.net, getallheaders (function.getallheaders); RFC 9110 section 5.5"
    level: MUST
    summary: "Leading and trailing whitespace around an HTTP/1.1 field value is not part of the value."
    transports: [h1]
    request:
      method: GET
      target: "/app/request/headers.php"
      headers:
        - ["X-Pad", "  padded value  "]
    expect:
      status: 200
      body_contains: "\"X-Pad\":\"padded value\""

  - id: php-req-headers-apache-alias
    tier: app
    source: "php.net, getallheaders (function.getallheaders)"
    level: MUST
    summary: "getallheaders() is an alias of apache_request_headers(); both return the same array."
    request:
      method: GET
      target: "/app/request/headers.php"
      headers:
        - ["X-Custom", "v1"]
    expect:
      status: 200
      body_contains: "\"apache_request_headers\":\"same\""

  - id: php-req-auth-basic
    tier: app
    source: "php.net, HTTP authentication with PHP (features.http-auth)"
    level: MUST
    summary: "Basic credentials appear as PHP_AUTH_USER and PHP_AUTH_PW."
    request:
      method: GET
      target: "/app/request/auth.php"
      headers:
        - ["Authorization", "Basic YWxpY2U6c2VjcmV0"]
    expect:
      status: 200
      body: "{\"PHP_AUTH_USER\":\"alice\",\"PHP_AUTH_PW\":\"secret\",\"HTTP_AUTHORIZATION\":\"Basic YWxpY2U6c2VjcmV0\"}"

  - id: php-req-auth-basic-colon-in-password
    tier: app
    source: "php.net, HTTP authentication with PHP (features.http-auth)"
    level: OBSERVED
    summary: "Only the first ':' separates user and password."
    request:
      method: GET
      target: "/app/request/auth.php"
      headers:
        - ["Authorization", "Basic YWxpY2U6c2U6Y3JldA=="]
    expect:
      status: 200
      body: "{\"PHP_AUTH_USER\":\"alice\",\"PHP_AUTH_PW\":\"se:cret\",\"HTTP_AUTHORIZATION\":\"Basic YWxpY2U6c2U6Y3JldA==\"}"

  - id: php-req-auth-bearer
    tier: app
    source: "php.net, HTTP authentication with PHP (features.http-auth)"
    level: MUST
    summary: "Only Basic is decoded: a Bearer token sets no PHP_AUTH_* and stays in HTTP_AUTHORIZATION."
    request:
      method: GET
      target: "/app/request/auth.php"
      headers:
        - ["Authorization", "Bearer abc.def"]
    expect:
      status: 200
      body: "{\"PHP_AUTH_USER\":null,\"PHP_AUTH_PW\":null,\"HTTP_AUTHORIZATION\":\"Bearer abc.def\"}"

  - id: php-req-auth-none
    tier: app
    source: "php.net, HTTP authentication with PHP (features.http-auth)"
    level: MUST
    summary: "Without Authorization no credential variables exist."
    request:
      method: GET
      target: "/app/request/auth.php"
