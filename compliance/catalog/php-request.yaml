  - id: php-req-json-input
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A JSON body leaves $_POST empty and is readable through php://input."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/json"]
      body: "{\"a\":1,\"b\":[true,null]}"
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"application/json\",\"content_length\":\"23\",\"post\":{},\"files\":0,\"input_length\":23,\"input_sha256\":\"1cc69c7fa23616ca2ec3ee70d24390a6225c8832db8a4c814c7e0e7f942f8668\",\"input\":\"{\\\"a\\\":1,\\\"b\\\":[true,null]}\",\"warning\":null}"

  - id: php-req-json-input-chunked
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A chunked JSON body is complete in php://input."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/json"]
      body: "{\"a\":1,\"b\":[true,null]}"
      framing: chunked
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"application/json\",\"content_length\":\"23\",\"post\":{},\"files\":0,\"input_length\":23,\"input_sha256\":\"1cc69c7fa23616ca2ec3ee70d24390a6225c8832db8a4c814c7e0e7f942f8668\",\"input\":\"{\\\"a\\\":1,\\\"b\\\":[true,null]}\",\"warning\":null}"

  - id: php-req-text-plain-not-parsed
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A text/plain body is not parsed into $_POST, even when it looks like a form."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "text/plain"]
      body: "a=1&b=2"
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"text/plain\",\"content_length\":\"7\",\"post\":{},\"files\":0,\"input_length\":7,\"input_sha256\":\"8e85be58c1c372ac29fe7bfa80d8ddcbd04a4032c7b51c1c026d67c55b1ab23f\",\"input\":\"a=1&b=2\",\"warning\":null}"

  - id: php-req-text-plain-chunked
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A chunked text/plain body is complete in php://input."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "text/plain"]
      body: "line1\nline2\n"
      framing: chunked
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":\"text/plain\",\"content_length\":\"12\",\"post\":{},\"files\":0,\"input_length\":12,\"input_sha256\":\"2751a3a2f303ad21752038085e2b8c5f98ecff61a2e4ebbd43506a941725be80\",\"input\":\"line1\\nline2\\n\",\"warning\":null}"

  - id: php-req-no-content-type-input
    tier: app
    source: "php.net, php:// wrappers, php://input (wrappers.php)"
    level: MUST
    summary: "A body without Content-Type leaves $_POST empty and is readable through php://input."
    request:
      method: POST
      target: "/app/request/input.php"
      body: "a=1"
    expect:
      status: 200
      body: "{\"method\":\"POST\",\"content_type\":null,\"content_length\":\"3\",\"post\":{},\"files\":0,\"input_length\":3,\"input_sha256\":\"c22fea5d7428e5cf47ef6354c97c9223c95d6dcdc3e0d2300ff79056b1ff3d85\",\"input\":\"a=1\",\"warning\":null}"

  - id: php-req-input-spilled-body
    tier: app
    source: "php.net, php:// wrappers, php://input (wrappers.php)"
    level: MUST
    summary: "A 3 MiB body above the gateway's memory spool arrives intact in php://input."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "application/octet-stream"]
      body_size: 3145728
      framing: chunked
    expect:
      status: 200
      body_contains: "\"input_length\":3145728,\"input_sha256\":\"f6dd7fec8584ad00219a447071c1fa368a1caee4d9c146083d233713ddccd2c0\""

  - id: php-req-post-max-size-form-empty
    tier: app
    source: "php.net, ini.core, post_max_size"
    level: MUST
    summary: "A form body above post_max_size (8M) leaves $_POST empty."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body_size: 9437184
    expect:
      status: 200
      body_contains: "{\"post\":{},"

  - id: php-req-post-max-size-warning
    tier: app
    source: "php.net, ini.core, post_max_size"
    level: OBSERVED
    summary: "PHP reports the oversized body with a warning naming both sizes."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body_size: 9437184
    expect:
      status: 200
      body_contains: "POST Content-Length of 9437184 bytes exceeds the limit of 8388608 bytes"

  - id: php-req-post-max-size-chunked
    tier: app
    source: "php.net, ini.core, post_max_size"
    level: MUST
    summary: "A chunked body above post_max_size also leaves $_POST empty; PHP sees its exact CONTENT_LENGTH."
    request:
      method: POST
      target: "/app/request/post.php"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body_size: 9437184
      framing: chunked
    expect:
      status: 200
      body_contains: "POST Content-Length of 9437184 bytes exceeds the limit"

  - id: php-req-post-max-size-files-empty
    tier: app
    source: "php.net, ini.core, post_max_size"
    level: MUST
    summary: "A multipart body above post_max_size leaves $_FILES and $_POST empty."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body_size: 9437184
    expect:
      status: 200
      body_contains: "{\"post\":{},\"count\":0,\"files\":{},"

  - id: php-req-post-max-size-get-kept
    tier: app
    source: "php.net, ini.core, post_max_size"
    level: MUST
    summary: "Above post_max_size $_GET is still filled, so a script can detect the dropped body."
    request:
      method: POST
      target: "/app/request/get.php?processed=1"
      headers:
        - ["Content-Type", "application/x-www-form-urlencoded"]
      body_size: 9437184
    expect:
      status: 200
      body: "{\"processed\":\"1\"}"

  - id: php-req-multipart-fields
    tier: app
    source: "php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "multipart/form-data fields without a filename fill $_POST."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"a\"\r\n\r\n1\r\n--XyZ\r\nContent-Disposition: form-data; name=\"b\"\r\n\r\nx y\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\",\"b\":\"x y\"},\"count\":0,\"files\":{},\"warning\":null}"

