      status: 200
      body: "{\"post\":{\"a\":\"1\",\"b\":\"x y\"},\"count\":0,\"files\":{},\"warning\":null}"

  - id: php-req-multipart-input-unavailable
    tier: app
    source: "php.net, php:// wrappers, php://input (wrappers.php)"
    level: MUST
    summary: "php://input is not available for multipart/form-data while enable_post_data_reading is on."
    request:
      method: POST
      target: "/app/request/input.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"a\"\r\n\r\n1\r\n--XyZ\r\nContent-Disposition: form-data; name=\"b\"\r\n\r\nx y\r\n--XyZ--\r\n"
    expect:
      status: 200
      body_contains: "\"input_length\":0,"

  - id: php-req-multipart-charset-param
    tier: app
    source: "RFC 7578 section 4.1; php.net, $_POST (reserved.variables.post)"
    level: MUST
    summary: "A charset parameter before the boundary does not stop parsing."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; charset=utf-8; boundary=XyZ"]
      body: "--XyZ\r\nContent-Disposition: form-data; name=\"a\"\r\n\r\n1\r\n--XyZ\r\nContent-Disposition: form-data; name=\"b\"\r\n\r\nx y\r\n--XyZ--\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\",\"b\":\"x y\"},\"count\":0,\"files\":{},\"warning\":null}"

  - id: php-req-multipart-quoted-boundary
    tier: app
    source: "RFC 7578 section 4.1; RFC 2046 section 5.1.1"
    level: MUST
    summary: "A quoted boundary parameter is unquoted before use."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=\"q b\""]
      body: "--q b\r\nContent-Disposition: form-data; name=\"a\"\r\n\r\n1\r\n--q b--\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\"},\"count\":0,\"files\":{},\"warning\":null}"

  - id: php-req-multipart-preamble-epilogue
    tier: app
    source: "RFC 2046 section 5.1.1"
    level: MUST
    summary: "Text before the first and after the last boundary is ignored."
    request:
      method: POST
      target: "/app/request/files.php"
      headers:
        - ["Content-Type", "multipart/form-data; boundary=XyZ"]
      body: "ignored preamble\r\n--XyZ\r\nContent-Disposition: form-data; name=\"a\"\r\n\r\n1\r\n--XyZ--\r\nignored epilogue\r\n"
    expect:
      status: 200
      body: "{\"post\":{\"a\":\"1\"},\"count\":0,\"files\":{},\"warning\":null}"

  - id: php-req-multipart-field-arrays
    tier: app
    source: "php.net, Variables From External Sources (language.variables.external)"
    level: MUST
    summary: "Multipart field names use the same array syntax as the query."
    request:
