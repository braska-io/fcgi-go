  - id: php-life-finish-request-holds-worker
    tier: app
    source: "php.net fastcgi_finish_request, user note (the script still occupies an FPM process)"
    level: OBSERVED
    summary: Four finished-but-running scripts free the gateway slots yet hold all four children, so the next call waits.
    steps:
      - request: { method: POST, target: "/app/pdo/obs.php?op=reset&k=life-finish-hold" }
        expect: { status: 200, body: "reset" }
      - parallel:
          - request: { method: POST, target: "/app/lifecycle/finish.php?after_ms=2500&k=life-finish-hold" }
            expect: { status: 200, body: "done", duration_max_ms: 1000 }
          - request: { method: POST, target: "/app/lifecycle/finish.php?after_ms=2500&k=life-finish-hold" }
            expect: { status: 200, body: "done", duration_max_ms: 1000 }
          - request: { method: POST, target: "/app/lifecycle/finish.php?after_ms=2500&k=life-finish-hold" }
            expect: { status: 200, body: "done", duration_max_ms: 1000 }
          - request: { method: POST, target: "/app/lifecycle/finish.php?after_ms=2500&k=life-finish-hold" }
            expect: { status: 200, body: "done", duration_max_ms: 1000 }
      - request: { method: GET, target: "/app/lifecycle/exit.php?case=string" }
        expect: { status: 200, body: "bye", duration_min_ms: 1000 }
      - wait_ms: 1000
      - request: { method: GET, target: "/app/pdo/obs.php?op=marks&k=life-finish-hold" }
        expect: { status: 200, body: "after first=true,after first=true,after first=true,after first=true" }

