; Fixed settings the app cases assume (catalog/php-app.yaml).
expose_php = On
memory_limit = 64M
max_execution_time = 5
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 5
output_buffering = 4096
session.save_path = /state/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.name = FCGISESSID
opcache.enable = 1
; The base image turns this off (docker-fpm.ini); the stderr cases need
; error_log() to arrive as FCGI_STDERR records.
fastcgi.logging = On
