; Loaded after the image's docker.conf, so these values win.
[global]
error_log = /proc/self/fd/2

[www]
listen = 9000
clear_env = yes
env[FIXTURE_STATE] = /state
pm = static
pm.max_children = 4
catch_workers_output = yes
; No PHP error_log: error_log() and logged errors then go out as FCGI_STDERR
; records (fastcgi.logging), which the stderr cases need.
php_admin_flag[log_errors] = on
; fpm ignores display_errors=stderr (main/main.c), so errors go to the log only.
php_admin_flag[display_errors] = off
